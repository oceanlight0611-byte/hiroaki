<style>
:root{--bg:#f5f2f8;--surface:#fff;--ink:#231f3d;--muted:#645f80;--line:#dbd4e6;--hema:#3b3a8c;--hema-ink:#fff;--eosin:#c22e6b;--ng:#b0521a}
@media (prefers-color-scheme:dark){:root{--bg:#15132a;--surface:#1f1c39;--ink:#ece9f7;--muted:#a7a2c4;--line:#37325f;--hema:#a2a0ff;--hema-ink:#15132a;--eosin:#ff86b2;--ng:#ffb070}}
*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;min-height:100vh}
[hidden]{display:none!important}
.lock{max-width:420px;margin:0 auto;padding:12vh 20px 40px}
.eyebrow{margin:0;font-size:11px;letter-spacing:.16em;color:var(--eosin);font-weight:700}
h1{margin:2px 0 4px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;font-size:1.8rem;line-height:1.3}
.stain{height:6px;margin:14px 0 22px;border-radius:3px;background:linear-gradient(90deg,var(--hema),var(--eosin))}
p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
label.rem{display:flex;gap:8px;align-items:center;margin:12px 2px;font-size:13px;color:var(--muted)}
label.rem input{width:18px;height:18px;accent-color:var(--hema)}
button{appearance:none;width:100%;border:0;border-radius:10px;padding:13px;background:var(--hema);color:var(--hema-ink);font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:1.6em;margin:12px 2px 0;font-size:13px;color:var(--ng)}
.note{margin-top:26px;font-size:12px;color:var(--muted)}
</style>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const P = JSON.parse($("payload").textContent);
  const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
  const b64 = u => { let s = ""; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  const te = new TextEncoder(), td = new TextDecoder();
  const salt = u8(P.salt), iv = u8(P.iv), mac = u8(P.mac), ct = u8(P.ct);
  const norm = p => p.trim().replace(/[\s-]/g, "");
  const KEY = "derm-lock-key";
  async function derive(pw) {
    const km = await crypto.subtle.importKey("raw", te.encode(norm(pw)), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: P.it }, km, 512));
  }
  async function decryptWith(key) {
    const mk = await crypto.subtle.importKey("raw", key.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const data = new Uint8Array(iv.length + ct.length); data.set(iv, 0); data.set(ct, iv.length);
    if (!(await crypto.subtle.verify("HMAC", mk, mac, data))) throw new Error("bad");
    const ek = await crypto.subtle.importKey("raw", key.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
    return td.decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, ek, ct));
  }
  function launch(html, key) {
    if (key) html = html.replace("<head>", "<head><script>window.__DK=Uint8Array.from(atob(\"" + b64(key) + "\"),function(c){return c.charCodeAt(0)});<\/script>");
    document.open(); document.write(html); document.close();
  }
  const msg = t => { $("msg").textContent = t; };
  if (!window.crypto || !crypto.subtle) { msg("この環境では開けません。https のアドレスで開いてください。"); $("go").disabled = true; }
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  (async () => {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || "null");
      if (s && s.s === P.salt) { const kk = u8(s.k); launch(await decryptWith(kk), kk); return; }
      if (s) localStorage.removeItem(KEY);
    } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  })();
  $("f").addEventListener("submit", async e => {
    e.preventDefault(); if (!crypto.subtle) return;
    const btn = $("go"); btn.disabled = true; msg("確認しています…");
    try {
      const key = await derive($("pw").value);
      const html = await decryptWith(key);
      try { if ($("rem").checked) localStorage.setItem(KEY, JSON.stringify({ s: P.salt, k: b64(key) })); } catch (e2) {}
      launch(html, key);
    } catch (err) { msg("パスワードが違います。"); btn.disabled = false; $("pw").select(); }
  });

})();
</script>
